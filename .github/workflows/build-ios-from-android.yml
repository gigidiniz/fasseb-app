name: FASSEB iOS - Diagnostico a partir do Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Ambiente Apple
        run: |
          node --version
          xcodebuild -version
          pod --version

      - name: Instalar dependencias
        run: npm ci

      - name: Preparar plugin Moodle
        run: npm run prod --prefix cordova-plugin-moodleapp

      - name: Gerar pacote de idiomas
        run: |
          mkdir -p src/assets/lang
          bash scripts/update_langpacks.sh
          test -f src/assets/lang/pt-br.json
          cp src/assets/lang/pt-br.json src/assets/lang/en.json

      - name: Gerar aplicativo web
        run: npm run build:prod

      - name: Adicionar plataforma iOS limpa
        run: npx cordova platform add ios@8.1.1 --no-save

      - name: Corrigir headers privados do plugin HTTP no iOS
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          base = Path('platforms/ios/App/Plugins/@moodlehq/cordova-plugin-advanced-http')
          files = ['SM_AFNetworkReachabilityManager.m', 'SM_AFHTTPSessionManager.m']
          for name in files:
              path = base / name
              if not path.is_file():
                  raise SystemExit(f'Arquivo esperado nao encontrado: {path}')
              data = path.read_text()
              if 'netinet6/in6.h' not in data:
                  raise SystemExit(f'Header esperado nao encontrado: {path}')
              path.write_text(data.replace('netinet6/in6.h', 'netinet/in.h'))
              print(f'Corrigido: {path}')
          PY

      - name: Ajustar import Swift do plugin Push para o modulo App
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('platforms/ios/App/Plugins/@moodlehq/phonegap-plugin-push/EncryptionHandler.m')
          if not path.is_file():
              raise SystemExit(f'Arquivo esperado nao encontrado: {path}')
          source = path.read_text()
          if '"Moodle-Swift.h"' not in source:
              raise SystemExit('Import Moodle-Swift.h nao encontrado; revisar plugin antes de alterar')
          source = source.replace('"Moodle-Swift.h"', '"App-Swift.h"')
          path.write_text(source)
          print('Import Swift ajustado para App-Swift.h')
          PY
          xcodebuild -project platforms/ios/App/App.xcodeproj -target App -showBuildSettings 2>/dev/null | grep -E 'PRODUCT_MODULE_NAME =|SWIFT_OBJC_INTERFACE_HEADER_NAME =|SWIFT_INSTALL_OBJC_HEADER =' | head -15 || true

      - name: Compilar iOS para simulador sem assinatura
        shell: bash
        run: |
          set -o pipefail
          npx cordova build ios --debug --emulator --buildFlag="-sdk iphonesimulator" --buildFlag="CODE_SIGNING_ALLOWED=NO" 2>&1 | tee build-ios.log

      - name: Salvar logs e diagnostico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fasseb-ios-diagnostico
          path: |
            build-ios.log
          if-no-files-found: warn
          retention-days: 7
